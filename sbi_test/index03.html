<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        *:focus {
            outline: 2px solid #000;
        }
        .wrap {
            padding: 20px;
        }
        .swiper {
            width: 100%;
            height: 100%;
            /* pointer-events: none; */
        }
        .swiper-wrapper {display: flex;}
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            font-size: 22px;
            color: #fff;
        }
        .btn {width: 100%; height: 100%; padding: 40px 0; font-size: 18px; color: #fff; border: none; background: none; cursor: pointer;}
        .btn:active {opacity: 0.5;}
    </style>
</head>

<body>
    <div class="wrap" role="button" title="제휴사 이동">
        <div class="inner" aria-label="제휴사 로고 쿠팡, 알리익스프레스, g마켓">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" style="background-color: red;">
                        <button type="button" class="btn">Slide 1</button>
                    </div>
                    <div class="swiper-slide" style="background-color: blue;">
                        <button type="button" class="btn">Slide 2</button>
                    </div>
                    <div class="swiper-slide" style="background-color: green;">
                        <button type="button" class="btn">Slide 3</button>
                    </div>
                    <div class="swiper-slide" style="background-color: yellowgreen;">
                        <button type="button" class="btn">Slide 4</button>
                    </div>
                    <div class="swiper-slide" style="background-color: skyblue;">
                        <button type="button" class="btn">Slide 5</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text"></div>
    </div>

    <script>
        const swiper = new Swiper('.mySwiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,
            // autoplay: {
            //     delay: 1000,
            // },
            slidesPerView: 3,
            spaceBetween: 30
        });

        addEventListener('focusin', (e) => {
            const isBtn = e.target.classList.contains('btn');
            const idx = parseInt(e.target.closest('.swiper-slide').dataset.swiperSlideIndex, 10);
            const text = document.querySelector('.text');
            if (isBtn) {
                text.textContent = (idx + 1) + '번 슬라이드 입니다.';
            }
        });

    </script>
</body>

</html>
