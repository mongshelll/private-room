<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        *:focus {
            outline: 2px solid #000;
        }
        button, [role="button"] {
            cursor: pointer;
            border: none;
            background: none;
        }
        button:active, [role="button"]:active {opacity: 0.7;}
        .wrap {
            padding: 20px;
        }
        .swiper {
            width: 100%;
            height: 100%;
            /* pointer-events: none; */
        }
        .swiper-wrapper {display: flex;}
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            font-size: 22px;
            color: #fff;
        }
        .btn {width: 100%; height: 100%; padding: 40px 0; font-size: 18px; color: #fff;}

        .scrollx {
            display: flex;
            overflow-x: auto;
            gap: 12px;
        }
        .item {
            flex: 0 0 auto;
            padding: 12px 20px;
            background-color: #356CF9;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <!-- <div class="wrap" role="button" title="제휴사 이동">
        <div class="inner" aria-label="제휴사 로고 쿠팡, 알리익스프레스, g마켓">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" style="background-color: red;">
                        <div>Slide 1</div>
                    </div>
                    <div class="swiper-slide" style="background-color: blue;">

                    <div class="swiper-slide" style="background-color: green;">

    <div class="wrap">
        <div class="scrollx">
            <button type="button" class="item">메뉴01</button>
            <button type="button" class="item">메뉴02</button>
            <button type="button" class="item">메뉴03</button>
            <button type="button" class="item">메뉴04</button>
            <button type="button" class="item">메뉴05</button>
            <button type="button" class="item">메뉴06</button>
            <button type="button" class="item">메뉴07</button>
            <button type="button" class="item">메뉴08</button>
            <button type="button" class="item">메뉴09</button>
            <button type="button" class="item">메뉴10</button>
        </div>
        <div class="text0"></div>
    </div>



    <div class="wrap">
        <div class="inner">
            <div class="swiper mySwiper2">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" style="background-color: red;">
                        <button type="button" class="btn">Slide 1</button>
                    </div>
                    <div class="swiper-slide" style="background-color: blue;">
                        <button type="button" class="btn">Slide 2</button>
                    </div>
                    <div class="swiper-slide" style="background-color: green;">
                        <button type="button" class="btn">Slide 3</button>
                    </div>
                    <div class="swiper-slide" style="background-color: yellowgreen;">
                        <button type="button" class="btn">Slide 4</button>
                    </div>
                    <div class="swiper-slide" style="background-color: skyblue;">
                        <button type="button" class="btn">Slide 5</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text"></div>
    </div>

    <script>
        const swiper = new Swiper('.mySwiper', {
            a11y: {
                enabled: true,
            },
            direction: 'horizontal',
            loop: true,
            // autoplay: {
            //     delay: 1000,
            // },
            slidesPerView: 3,
            spaceBetween: 30
        });

        const swiper2 = new Swiper('.mySwiper2', {
            a11y: {
                enabled: true,
            },
            direction: 'horizontal',
            loop: true,
            slidesPerView: 3,
            spaceBetween: 30
        });

        (function () {
            const isBtn = document.querySelectorAll('.btn')
            isBtn.forEach((btn) => {
                btn.addEventListener('focus', (e) => {
                    const idx = parseInt(e.target.closest('.swiper-slide').dataset.swiperSlideIndex, 10);
                    const text = document.querySelector('.text');
                    text.textContent = (idx + 1) + '번 슬라이드 입니다.';
                });
            });



            const isMEnu = document.querySelectorAll('.item')
            isMEnu.forEach((menu) => {
                menu.addEventListener('focus', (e) => {
                    const idx = Array.from(isMEnu).indexOf(e.target);
                    const text = document.querySelector('.text0');
                    console.log(idx);
                    text.textContent = (idx + 1) + '번 메뉴 입니다.';
                });
            });
        })()

    </script>
</body>

</html>
