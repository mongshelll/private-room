<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        .wrap {
            padding: 20px;
        }
        .swiper {
            width: 100%;
            height: 200px;
            pointer-events: none;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
        }
    </style>
</head>

<body>
    
    <div class="wrap" role="button" title="제휴사 이동">
        <div class="inner" aria-label="제휴사 로고 쿠팡, 알리익스프레스, g마켓">
            <div class="swiper mySwiper" aria-hidden="true">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" style="background-color: red;">Slide 1</div>
                    <div class="swiper-slide" style="background-color: blue;">Slide 2</div>
                    <div class="swiper-slide" style="background-color: green;">Slide 3</div>
                </div>
            </div>
        </div>

        22
    </div>

    <script>
        const swiper = new Swiper('.mySwiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,
            autoplay: {
                delay: 1000,
            },
        });
    </script>
</body>

</html>
