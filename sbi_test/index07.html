<!DOCTYPE html>

<head>

<body>

        <input type="checkbox" name="" id="chk1">

    <div class="row">
        <input type="checkbox" name="" id="chk2">

    </div>
    <div class="row">
        <img src="../favicon.png" alt="">

    <div class="row">
        <img src="../favicon.png" alt="logo">
    </div>
    <div class="row" aria-hidden="true">
        <img src="../favicon.png" alt="">
    </div>

</html>
