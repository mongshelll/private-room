    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type=range] {appearance: none; background: red;}
        input[type=range]::-webkit-slider-runnable-track {width: 100%; height: 8px; cursor: pointer; background: linear-gradient(to right, #fff, #000) no-repeat; background-size: contain; border-radius: 12px;}
        input[type=range]::-webkit-slider-thumb {appearance: none; width: 16px; height: 16px; background: #303030; border-radius: 50%; cursor: pointer; margin-top: -4px;}
    </style>
</head>
<body>
<div class="range-wrap">
    <div>
        <button type="button" class="edit-value-btn" onclick="range.setValue(targetInput01, 1500);">
            <span>range 값 변경 버튼</span>
            <output></output><span class="num-unit"></span>
        </button>
    </div>
    <div>
        <input type="range" id="targetInput01" class="ragne-test" value="3000" min="1" max="3000" step="1">
    </div>
</div>

<script>
    const range = (() => {

        /* ===============================
        * utils
        * =============================== */
        const comma = (value) =>
            Number(value).toLocaleString();

        const getUnit = (wrap) => {
            const unitEl = wrap.querySelector('.num-unit');
            return unitEl ? unitEl.textContent.trim() : '';
        };

        /* ===============================
        * UI update
        * =============================== */
        const updateUI = (el) => {
            const wrap = el.closest('.range-wrap');
            if (!wrap) return;

            const output = wrap.querySelector('.rangevalue, output');
            const button = el.closest('button');

            const unit = getUnit(wrap);
            const value = el.value;
            const formatted = comma(value);

            // output 업데이트
            if (output) {
                if ('value' in output) {
                    output.value = formatted;
                } else {
                    output.textContent = formatted;
                }
                output.setAttribute('title', formatted);
            }

            // aria-valuetext (접근성)
            el.setAttribute(
                'aria-valuetext',
                unit.includes('원') ? `${formatted}${unit}` : `${value}${unit}`
            );

            // button aria-label
            if (button) {
                button.setAttribute(
                    'aria-label',
                    unit.includes('원') ? `${formatted}${unit}` : `${value}${unit}`
                );
            }

            // range fill
            const min = Number(el.min || 0);
            const max = Number(el.max || 100);
            el.style.backgroundSize = ((value - min) * 100) / (max - min) + '% 100%';
        };

        /* ===============================
        * event binding
        * =============================== */
        const bind = (el) => {
            el.addEventListener('input', () => {
                updateUI(el);
            });

            // iOS VoiceOver 대응
            el.addEventListener('change', () => {
                updateUI(el);
                console.log('함수 내부 change');
            });
        };

        /* ===============================
        * public API
        * =============================== */
        return {
            init() {
                document.querySelectorAll('input[type="range"]').forEach(el => {
                    updateUI(el);
                    bind(el);
                });
            },
            setValue(el, value) {
                if (!el) return;
                el.value = value;
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
            }
        };
    })();


    targetInput01.addEventListener('change', () => {
        console.log('함수 외부 change');
    })

    // 로드 후 기본 실행 함수모음
    function ready() {
        range.init();
    }

    // 로드 후 실행
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ready);
    } else {
        ready();
    }
