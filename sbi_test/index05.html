<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>롤링 테스트 (3단 복제)</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ul, li { list-style: none; }

    .rolling-bar { overflow: hidden; position: relative; width: 100%; height: 100px; background: #000; display: flex; align-items: center; }
    .roller { position: absolute; top: 0; left: 0; display: flex; align-items: center; height: 100%; }
    .roller li { margin-left: 20px; }
    .logo-box { width: 60px; height: 60px; background-color: #fff; border-radius: 24px; }

    /* 각 roller 애니메이션 적용 */
    .roller { animation: rollingleft01 40s linear infinite; }
    .roller[class*=clone] { animation: rollingleft02 40s linear infinite; }
    .roller li { animation: 3s linear infinite movingVertical; }
    .roller li:nth-child(odd) { animation-name: movingVertical2; }

    /* 복제본 reverse용 */
    .reverse li { animation-name: movingVertical2; }
    .reverse li:nth-child(odd) { animation-name: movingVertical; }

    /* horizontal 롤링 */
    @keyframes rollingleft01 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-200%); }
        50.01% { transform: translateX(0%); }
        100% { transform: translateX(-200%); }
    }

    @keyframes rollingleft02 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-200%); }
    }

    /* vertical 흔들림 */
    @keyframes movingVertical { 0%,100% { transform: translateY(-10px); } 50% { transform: translateY(10px); } }
    @keyframes movingVertical2 { 0%,100% { transform: translateY(10px); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>

<div class="rolling-bar">
    <ul class="roller">
        <li><div class="logo-box"></div></li>
        <li><div class="logo-box"></div></li>
        <li><div class="logo-box"></div></li>
        <li><div class="logo-box"></div></li>
        <li><div class="logo-box"></div></li>
    </ul>
</div>

<script>
$(function () {
    const $rollingBar = $('.rolling-bar');
    const $roller = $rollingBar.find('.roller');

    // 원본 roller 복제
    const $clone1 = $roller.clone().appendTo($rollingBar);
    const $clone2 = $roller.clone().appendTo($rollingBar);
    const $clone3 = $roller.clone().appendTo($rollingBar);

    $roller.addClass('original');
    $clone1.addClass('clone');
    $clone2.addClass('clone2');
    $clone3.addClass('clone3');

    // roller 가로 크기 계산
    const rollerWidth = $roller.outerWidth(true);

    // 각각 위치 지정
    $roller.css('left', 0);
    $clone1.css('left', rollerWidth);
    $clone2.css('left', rollerWidth * 2);
    $clone3.css('left', rollerWidth * 3);

    // li 홀짝 체크
    const itemCount = $roller.find('li').length;
    if (itemCount % 2 === 1) {
        $clone1.addClass('reverse');
        $clone3.addClass('reverse');
    }

    // li 개수 기반 속도 계산
    const duration = Math.max(20, itemCount * 8); // 최소 20s, li수 * 8s
    $roller.css('animation-duration', duration * 2 + 's');
    $clone1.css('animation-duration', duration + 's');
    $clone2.css('animation-duration', duration + 's');
    $clone3.css('animation-duration', duration + 's');
});
</script>

</body>
</html>
