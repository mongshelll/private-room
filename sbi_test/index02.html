<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        button, [role="button"] {
            cursor: pointer;
            border: none;
            background: none;
        }
        .wrap {
            padding: 20px;
        }
        .box {
            border: 1px solid #000;
            border-radius: 12px;
            padding: 16px;
            background-color: #356CF9;
        }
        .content .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            color: #fff;
        }
        .content .desc {
            font-size: 14px;
            color: #555;
            margin-bottom: 16px;
            text-align: center;
            color: #fff;
        }
        .cont-footer .btn-area .btn {
            overflow: hidden;
            position: relative;
            padding: 8px 16px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background-color: #fff;
        }
        .btn .gradient-text {
            font-size: 14px;
            font-weight: 500;
            background: linear-gradient(90deg, #37F 13.22%, #8228FF 61.16%, #2937FF 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="content">
                <div class="title">타이틀</div>
                <div class="desc">내용</div>
            </div>
            <div class="cont-footer">
                <div class="btn-area">
                    <button type="button" class="btn">
                        <span class="gradient-text">텍스트 테스트 버튼</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
